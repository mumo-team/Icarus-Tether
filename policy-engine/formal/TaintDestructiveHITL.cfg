SPECIFICATION Spec

\* 수정판(gate 판별자 지문 = offer 공간 서로소)이 기본 — 위반 0이 정상.
\* SharedKeys = TRUE(naive 공유 키 재현)로 바꾸면 GateIsolation이 짧은 반례로
\* 깨진다 (설계 검토에서 발견한 교차 SUPERSEDED/소각 — README 참조).
CONSTANT UNodes = {u1, u2}
CONSTANT Calls = {c1, c2}
CONSTANT SharedKeys = FALSE

INVARIANT TypeOK
INVARIANT DestructiveSafety
INVARIANT ApprovalFreshness
INVARIANT GateIsolation
INVARIANT SnapConsistency
